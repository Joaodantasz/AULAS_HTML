<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>

    <!-- TABELAS -->
    <!--  

    <table> = define a tabela
    <thead> = define a região do cabeçalho
    <tr> = define uma linha de tabela
    <th> = define um cabeçalho (deixa em negrito)
    <tbody> = define a região do corpo
    <td> = define uma célula (dados da tabela)
    border = "1" = adiciona bordas na tabela    
     -->

     
        <table border ="1">
    <thead>

        <th>Nome</th>
        <th>Idade</th>
        <th>Cidade</th>


        <tr>
        <thead>
            <tbody>
<tr>
    <td>João</td>
    <td>16</td>
    <td>Guarulhos</td>
</tr>


<tr>
    <td>Pietro</td>
    <td>17</td>
    <td>São Paulo</td>
</tr>

    </tbody>
 
    </tr>
    </thead>
</table>

    

</body>
</html>
