<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estilo</title>

    <!-- CSS interno -->
    <!-- Ele fica dentro da tag <style> dentro <head> no HTML-->
         <!-- CSS externo, o melhor de todos!!!-->
        <style>
            h1 {
                color: blue;
            }
        </style>
    <!-------------------------------------------------->
        <link rel="stylesheet" href="./css/style.css">
    <!-------------------------------------------------->

</head>
<body>
        <!-- CSS (Cascading Style Sheets) é o que dá forma, cor, design e estilo ao HTML -->

        <!-- CSS inline-->

        <!--Definifdo diretamente na tag HTML dentro do atributo style= ""   -->

        <!-- Quando usar o CSS?
        Quando você precisa estilizar um único elemento rapidamente (ex: testar uma cor diferente em um botão) 
        -->

    <h1 style="font-size: 54px;">Título em azul</h1>
    <!-- O "PX" define o tamanho -->

    <h2>DSI1-SESI OS MELHORES</h2>
    
</body>
</html>
