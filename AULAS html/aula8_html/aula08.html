<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AULA 08</title>
</head>
<body>
    
    <!--
     <Form> = define um formulário 
    <input> = campo de entrada (com vários tipos: text, password, email, number e etc..)
    <label> = associa um texto descritivo a um <input>
    <textarea> = área de texto maior
    <select> e <option> = criam menus suspensos (dropdown)    
    <button> = botão clicável
    <fieldset> e <legend> = agrupam e nomeiam partes de um formulário
    <datalist> = lista de sugestões para <input>
    <post> =  para onde vai ser enviado
    -->

     <h1>Formulário completo</h1>

        <form action="/enviar-dados" method="post">

    <fieldset>
        <legend>Informações pessoais</legend>

        <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="Nome"
            placeholder="Digite seu nome" required><br>

                <label for="email">E-mail:</label>
                    <input type="text" id="email" name="email"
                        placeholder="seuemail@euamosenai.com.br"
                required><br

                <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha"
                 placeholder="digite sua senha"
                    required><br

        <label for="idade">Idade:</label>
            <input type="number" id="idade" name="idade"
                    min="18" max="99"
                placeholder="idade"><br

                    <label for="datanascimento">Data de nascimento:</label>
            <input type="date" id="datanascimento" name="datanascimento"
                placeholder="idade"
                    required><br

                    <label for="gênero">Sexo:</label>
                    <select name="gênero" id="gênero">
                        <option value="Masculino">Masculino</option>
                        <option value="Feminino">Feminino</option>
                        <option value="Outro">Outro</option>
                        <option value="Prefiro não informar">Prefiro não informar</option>
                    </select><br

        </fieldset>
    <br>
        <fieldset>

        <legend>Detalhes adicionais</legend>

            <label for="bio">Fale Sobre você:</label>
        <textarea name="bio" id="bio" rows="5"
            placeholder="Fale um pouco sobre você..">
    </textarea>

    <br>

        <label for="linguagem">Linguagem Favorita:</label>
        <input type="text" id="linguagem" name="linguagem" list="linguagens"
    <datalist>

    <datalist id="linguagens">
        <option value="HTML">
            <option value="CSS">
                <option value="Python">
                    <option value="JavaScript">
                        <option value="Java">
    </datalist>


    </fieldset>




     </form>                                                       





</body>
</html>
